services:
  accounts:
    image: gcr.io/dsxack/accounts:latest
#    build:
#      context: ../
#      dockerfile: Dockerfile
    depends_on:
      - postgres
    ports:
      - "50055:50055"
      - "9099:9099"
      - "8010:8010"
    volumes:
      - ./config.yml:/root/config.yml
    restart: unless-stopped
    pull_policy: always

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.14.1
    volumes:
      - ../migrations:/migrations
    command:
      -path=/migrations 
      -database="postgres://myuser:mypassword@postgres:5432/mydatabase?sslmode=disable" up
    container_name: postgres-migrate

volumes:
  postgres_data:
    driver: local