services:
  accounts:
    build:
      context: ../
      dockerfile: Dockerfile
    depends_on:
      - postgres
    ports:
      - "50055:50055"
      - "9099:9099"
    volumes:
      - ./config.yml:/root/config.yml
    restart: unless-stopped

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local