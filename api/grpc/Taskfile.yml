version: "3"

vars:
  PROTOC_IMAGE: '{{.PROTOC_IMAGE | default "protoc"}}'

tasks:
  format:
    desc: Format code
    cmds:
      - buf format -w accountservice/v1beta/*.proto

  lint:
    desc: Lint proto files
    cmds:
      - buf lint

  lock:
    desc: Lock dependencies
    cmds:
      - buf mod update

  generate:
    desc: Generate code with protoc plugins
    cmds:
      - buf mod update
      - buf generate

