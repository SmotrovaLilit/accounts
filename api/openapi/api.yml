openapi: 3.0.0
info:
  title: AccountService API
  version: 1.0.0
  description: |
    AccountService manages accounts, including account creation, balance top-ups,
    funds transfer, and querying account information.
servers:
  - url: https://api.example.com/v1beta1 // Change this
    description: Production server
  - url: http://localhost:8080/v1beta1
    description: Development server
paths:
  /accounts:
    post:
      summary: Create a new account
      operationId: CreateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '204':
          description: Account created successfully, no content returned

  /accounts/{id}/top-up:
    post:
      summary: Top up account balance
      operationId: TopUpAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Account ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopUpAccountRequest'
      responses:
        '204':
          description: Account topped up successfully

  /accounts/transfer:
    post:
      summary: Transfer funds between accounts
      operationId: TransferFunds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferFundsRequest'
      responses:
        '204':
          description: Funds transferred successfully

  /accounts/{id}:
    get:
      summary: Get account details
      operationId: GetAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Account ID
      responses:
        '200':
          description: Account details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
components:
  schemas:
    CreateAccountRequest:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the account
        owner_id:
          type: string
          description: Identifier for the account's owner
        currency:
          $ref: '#/components/schemas/Currency'
    Currency:
      type: string
      enum:
        - CURRENCY_USD
        - CURRENCY_EUR
    TopUpAccountRequest:
      type: object
      properties:
        id:
          type: string
          description: Identifier of the account to top up
        amount:
          type: integer
          format: int64
          description: Amount to add to the account's balance, in cents
    TransferFundsRequest:
      type: object
      properties:
        from_account_id:
          type: string
          description: Identifier of the account to transfer funds from
        to_account_id:
          type: string
          description: Identifier of the account to transfer funds to
        amount:
          type: integer
          format: int64
          description: Amount to transfer, in cents
    GetAccountRequest:
      type: object
      properties:
        id:
          type: string
          description: Identifier of the account to retrieve
    Account:
      type: object
      required: [id, owner_id, currency, balance, created_at, updated_at]
      properties:
        id:
          type: string
          description: Unique identifier of the account
        owner_id:
          type: string
          description: Identifier of the account's owner
        currency:
          $ref: '#/components/schemas/Currency'
        balance:
          type: integer
          format: int64
          description: Current balance of the account, in cents
        created_at:
          type: string
          format: date-time
          description: Date the account was created
        updated_at:
          type: string
          format: date-time
          description: Date the account was last updated
